<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atrapa lo Loco — Cosas Locas #2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="hud">
      <a class="back" href="../index.html">←</a>
      <div class="hud-center">
        <p class="series">🤪 Cosas Locas #2</p>
        <h1>Atrapa lo Loco</h1>
      </div>
      <div class="hud-stats">
        <span id="score">0</span>
        <span id="time">30</span>
      </div>
    </header>

    <main id="arena" aria-label="Zona de juego">
      <div id="start" class="panel">
        <span class="big-emoji">🎬🎪</span>
        <h2>¡Dibujos animados locos!</h2>
        <p>Atrapa personajes de cartoon antes de que desaparezcan. ¡Cuanto más raro, más puntos!</p>
        <button type="button" id="btn-start" class="btn">¡Empezar la locura!</button>
      </div>

      <div id="play" class="play hidden">
        <p class="tip">Clic en las cosas locas · ¡Rápido!</p>
      </div>

      <div id="end" class="panel hidden">
        <span class="big-emoji" id="end-emoji">🏆</span>
        <h2 id="end-title">¡Qué locura!</h2>
        <p id="end-msg">Puntuación: 0</p>
        <button type="button" id="btn-again" class="btn">Otra vez</button>
      </div>
    </main>
  </div>
  <script src="cartoon-art.js"></script>
  <script src="game.js"></script>
</body>
</html>
