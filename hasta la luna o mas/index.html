<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Hasta la luna o más</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --pad-bottom: calc(env(safe-area-inset-bottom, 0px) + 112px);
      }
      html, body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0a0a1a;
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }

      #back-link {
        display: none;
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: 8px;
        z-index: 10001;
        padding: 8px 14px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.55);
        border: 2px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        text-decoration: none;
        font-family: "Segoe UI", sans-serif;
        font-size: 14px;
        touch-action: manipulation;
      }
      body.standalone #back-link { display: block; }

      #touch-controls {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        pointer-events: none;
      }
      #touch-controls.visible { display: block; }
      #touch-controls .move-group {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: var(--pad-bottom);
        display: flex;
        gap: 10px;
        pointer-events: none;
      }
      #touch-controls button {
        pointer-events: auto;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        border: 2px solid rgba(255, 255, 255, 0.45);
        background: rgba(20, 20, 40, 0.72);
        color: #fff;
        font-size: 28px;
        line-height: 1;
        border-radius: 18px;
        min-width: 76px;
        min-height: 76px;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
        user-select: none;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
      #touch-controls button.pressed {
        background: rgba(255, 255, 255, 0.38);
        border-color: rgba(255, 255, 255, 0.85);
        transform: scale(0.96);
      }
      #touch-controls #tc-jump {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: var(--pad-bottom);
        min-width: 88px;
        min-height: 88px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }
      #touch-controls #tc-jump small {
        font-size: 10px;
        letter-spacing: 0.04em;
        margin-top: 2px;
        opacity: 0.9;
      }

      #menu-btns, #lobby-ui {
        display: none;
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10002;
        width: min(92%, 320px);
        flex-direction: column;
        gap: 10px;
        pointer-events: auto;
      }
      #menu-btns { bottom: 28%; }
      #lobby-ui { bottom: 22%; text-align: center; }
      #menu-btns.visible, #lobby-ui.visible { display: flex; }
      #menu-btns button, #lobby-ui button {
        touch-action: manipulation;
        border: 2px solid rgba(255,255,255,0.4);
        background: rgba(30,30,60,0.9);
        color: #fff;
        font-family: "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 600;
        padding: 14px 16px;
        border-radius: 14px;
      }
      #lobby-ui p {
        color: #ddeeff;
        font-family: "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.45;
        background: rgba(0,0,0,0.45);
        padding: 10px 12px;
        border-radius: 12px;
      }
      #lobby-room { font-size: 18px; font-weight: 700; color: #fff; }

      #local-pick {
        display: none;
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 28%;
        z-index: 10002;
        width: min(92%, 320px);
        flex-direction: column;
        gap: 10px;
      }
      #local-pick.visible { display: flex; }
      #local-pick button {
        touch-action: manipulation;
        border: 2px solid rgba(255,255,255,0.4);
        background: rgba(30,30,60,0.9);
        color: #fff;
        font-family: "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 600;
        padding: 14px 16px;
        border-radius: 14px;
      }
      #split-touch {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        pointer-events: none;
      }
      #split-touch.visible { display: block; }
      .split-chunk-pad {
        position: absolute;
        left: 0;
        right: 0;
        pointer-events: none;
        border-bottom: 3px solid rgba(255, 255, 255, 0.2);
        box-sizing: border-box;
      }
      .split-chunk-pad:last-child { border-bottom: none; }
      .split-chunk-label {
        position: absolute;
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Segoe UI", sans-serif;
        font-size: 11px;
        color: rgba(255,255,255,0.55);
        pointer-events: none;
      }
      .split-chunk-controls {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
      }
      .split-chunk-controls .move-group {
        display: flex;
        gap: 6px;
        pointer-events: none;
      }
      .split-chunk-pad button {
        pointer-events: auto;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        border: 2px solid rgba(255, 255, 255, 0.45);
        background: rgba(20, 20, 40, 0.82);
        color: #fff;
        font-size: 22px;
        line-height: 1;
        border-radius: 14px;
        min-width: 58px;
        min-height: 54px;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
        user-select: none;
      }
      .split-chunk-pad button.pressed {
        background: rgba(255, 255, 255, 0.38);
        border-color: rgba(255, 255, 255, 0.85);
      }
      .split-chunk-pad[data-players="4"] button {
        min-width: 46px;
        min-height: 42px;
        font-size: 18px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <a id="back-link" href="../index.html">← Volver</a>
    <div id="game"></div>
    <div id="menu-btns">
      <button type="button" id="btn-solo">🎮 Jugar solo</button>
      <button type="button" id="btn-create">👥 Crear sala online</button>
      <button type="button" id="btn-join">🔗 Unirse a sala</button>
      <button type="button" id="btn-local">🕹️ Local (misma pantalla)</button>
    </div>
    <div id="local-pick">
      <button type="button" id="local-2">👥 2 jugadores</button>
      <button type="button" id="local-3">👥 3 jugadores</button>
      <button type="button" id="local-4">👥 4 jugadores</button>
    </div>
    <div id="lobby-ui">
      <p id="lobby-room">Sala: ----</p>
      <p id="lobby-players">Jugadores: …</p>
      <button type="button" id="lobby-copy">📋 Copiar enlace</button>
      <button type="button" id="lobby-start">🚀 ¡Empezar partida!</button>
    </div>
    <div id="touch-controls" aria-label="Controles táctiles">
      <div class="move-group">
        <button type="button" id="tc-left" aria-label="Izquierda">←</button>
        <button type="button" id="tc-right" aria-label="Derecha">→</button>
      </div>
      <button type="button" id="tc-jump" aria-label="Saltar">↑<small>SALTAR</small></button>
    </div>
    <div id="split-touch" aria-label="Controles multijugador local"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
      const GAME_WIDTH = 480;
      const GAME_HEIGHT = 720;

      const PLAYER_CFG = {
        width: 28, height: 36, speed: 220,
        jumpVelocity: -420, doubleJumpVelocity: -380,
        gravity: 900, maxFallSpeed: 600,
      };

      const WORLD = {
        platformMinWidth: 90, platformMaxWidth: 170, platformHeight: 14,
        verticalGapMin: 65, verticalGapMax: 112, horizontalMargin: 36,
        dangerZoneOffset: 120,
      };

      // Alcance máximo del jugador (doble salto + movimiento lateral)
      const JUMP_REACH = {
        maxVertical: 165,
        maxHorizontal: 175,
      };

      function maxHorizontalReach(verticalGap) {
        const t = Phaser.Math.Clamp(verticalGap / WORLD.verticalGapMax, 0, 1);
        return Phaser.Math.Linear(JUMP_REACH.maxHorizontal, 95, t);
      }

      const ALTITUDE = { metersPerPixel: 0.5, moonThreshold: 100000 };
      const BEST_KEY = "hasta-la-luna-best";

      const ZONES = [
        { name: "Tierra", minMeters: 0, topColor: 0x87ceeb, bottomColor: 0x5d8a3c, platformColor: 0x6b4f2a, accentColor: 0x8fbc5a },
        { name: "Cielo", minMeters: 500, topColor: 0x1e90ff, bottomColor: 0x87ceeb, platformColor: 0x4a7ab5, accentColor: 0xa8d8ff },
        { name: "Nubes", minMeters: 2000, topColor: 0xb8d4f0, bottomColor: 0xe8f4ff, platformColor: 0xc8d8e8, accentColor: 0xffffff },
        { name: "Estratosfera", minMeters: 5000, topColor: 0x1a0a3e, bottomColor: 0x4a2080, platformColor: 0x5c3d8a, accentColor: 0xc77dff },
        { name: "Espacio", minMeters: 15000, topColor: 0x000008, bottomColor: 0x0a0a2e, platformColor: 0x2a2a4a, accentColor: 0x88ccff },
        { name: "Hacia la luna", minMeters: 50000, topColor: 0x000005, bottomColor: 0x101025, platformColor: 0x4a4a5a, accentColor: 0xe8e8f0 },
        { name: "La luna", minMeters: 100000, topColor: 0x0a0a12, bottomColor: 0x2a2a35, platformColor: 0x6a6a75, accentColor: 0xf0f0f5 },
      ];

      function getZoneForAltitude(meters) {
        let zone = ZONES[0];
        for (const z of ZONES) if (meters >= z.minMeters) zone = z;
        return zone;
      }

      function formatAltitude(meters) {
        if (meters >= 1000000) return (meters / 1000000).toFixed(2) + " Mm";
        if (meters >= 10000) return (meters / 1000).toFixed(1) + " km";
        if (meters >= 1000) return (meters / 1000).toFixed(2) + " km";
        return Math.floor(meters) + " m";
      }

      const touchControls = {
        left: false,
        right: false,
        jumpPressed: false,
        enabled: false,
        resetJump() { this.jumpPressed = false; },
        resetAll() { this.left = false; this.right = false; this.jumpPressed = false; },
      };

      const localTouchPads = [0, 1, 2, 3].map(() => ({
        left: false, right: false, jumpPressed: false,
        resetJump() { this.jumpPressed = false; },
        resetAll() { this.left = false; this.right = false; this.jumpPressed = false; },
      }));
      const holdTouchesPads = [0, 1, 2, 3].map(() => ({ left: new Set(), right: new Set() }));

      const LOCAL_BINDINGS = [
        { name: "Jugador 1", color: 0xff6b4a, touch: 0, keys: { left: ["LEFT"], right: ["RIGHT"], jump: ["UP", "SPACE"] } },
        { name: "Jugador 2", color: 0x4a9fff, touch: 1, keys: { left: ["A"], right: ["D"], jump: ["W"] } },
        { name: "Jugador 3", color: 0x66ee88, touch: 2, keys: { left: ["J"], right: ["L"], jump: ["I"] } },
        { name: "Jugador 4", color: 0xff66ee, touch: 3, keys: { left: ["F"], right: ["H"], jump: ["T"] } },
      ];

      const IN_IFRAME = window.self !== window.top;

      function shouldUseTouchControls() {
        if (IN_IFRAME) return false;
        try {
          if (window.matchMedia("(pointer: coarse)").matches) return true;
          if (window.matchMedia("(hover: none)").matches) return true;
        } catch (e) {}
        if (navigator.maxTouchPoints > 0) return true;
        if ("ontouchstart" in window) return true;
        if (window.innerWidth <= 900) return true;
        return false;
      }

      function touchIdsFromEvent(e) {
        if (e.changedTouches && e.changedTouches.length) {
          return Array.from(e.changedTouches, (t) => t.identifier);
        }
        if (e.pointerId !== undefined) return [e.pointerId];
        return ["mouse"];
      }

      const holdTouches = { left: new Set(), right: new Set() };

      function syncHoldVisuals() {
        touchControls.left = holdTouches.left.size > 0;
        touchControls.right = holdTouches.right.size > 0;
        document.getElementById("tc-left").classList.toggle("pressed", touchControls.left);
        document.getElementById("tc-right").classList.toggle("pressed", touchControls.right);
      }

      function releaseHoldTouches(e) {
        for (const id of touchIdsFromEvent(e)) {
          holdTouches.left.delete(id);
          holdTouches.right.delete(id);
        }
        syncHoldVisuals();
      }

      function bindHoldButtonGlobal(btn, side, holdMap, syncFn) {
        const map = holdMap || holdTouches;
        const sync = syncFn || syncHoldVisuals;
        const press = (e) => {
          e.preventDefault();
          e.stopPropagation();
          for (const id of touchIdsFromEvent(e)) map[side].add(id);
          sync();
        };
        btn.addEventListener("touchstart", press, { passive: false });
        btn.addEventListener("mousedown", press);
        btn.addEventListener("contextmenu", (e) => e.preventDefault());
      }

      function bindTapButton(btn, onTap) {
        const tap = (e) => {
          e.preventDefault();
          e.stopPropagation();
          btn.classList.add("pressed");
          onTap();
          setTimeout(() => btn.classList.remove("pressed"), 120);
        };
        btn.addEventListener("touchstart", tap, { passive: false });
        btn.addEventListener("mousedown", tap);
      }

      function initDomTouchControls() {
        if (new URLSearchParams(location.search).get("from") === "leocepa") {
          document.body.classList.add("standalone");
        }

        touchControls.enabled = shouldUseTouchControls();
        const panel = document.getElementById("touch-controls");
        if (!touchControls.enabled) return;

        document.body.classList.add("touch-mode");
        panel.classList.add("visible");

        bindHoldButtonGlobal(document.getElementById("tc-left"), "left");
        bindHoldButtonGlobal(document.getElementById("tc-right"), "right");
        bindTapButton(
          document.getElementById("tc-jump"),
          () => { touchControls.jumpPressed = true; }
        );

        document.addEventListener("touchend", releaseHoldTouches, { passive: false });
        document.addEventListener("touchcancel", releaseHoldTouches, { passive: false });

        document.addEventListener("touchmove", (e) => {
          if (e.target.closest("#touch-controls") || e.target.closest("#back-link")) return;
          e.preventDefault();
        }, { passive: false });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) return;
          resetAllTouchPads();
        });
      }

      function makeSyncHoldVisuals(idx) {
        return () => {
          localTouchPads[idx].left = holdTouchesPads[idx].left.size > 0;
          localTouchPads[idx].right = holdTouchesPads[idx].right.size > 0;
          const pad = document.querySelector('.split-chunk-pad[data-idx="' + idx + '"]');
          if (!pad) return;
          pad.querySelector(".btn-left").classList.toggle("pressed", localTouchPads[idx].left);
          pad.querySelector(".btn-right").classList.toggle("pressed", localTouchPads[idx].right);
        };
      }

      function releaseAllSplitTouches(e) {
        for (const id of touchIdsFromEvent(e)) {
          for (let i = 0; i < holdTouchesPads.length; i++) {
            holdTouchesPads[i].left.delete(id);
            holdTouchesPads[i].right.delete(id);
          }
        }
        for (let i = 0; i < 4; i++) makeSyncHoldVisuals(i)();
      }

      let splitTouchBuilt = false;

      function showSplitTouch(count) {
        if (!touchControls.enabled) return;
        const root = document.getElementById("split-touch");
        root.classList.add("visible");
        root.innerHTML = "";
        const pct = 100 / count;
        for (let i = 0; i < count; i++) {
          const chunk = document.createElement("div");
          chunk.className = "split-chunk-pad";
          chunk.dataset.idx = String(i);
          chunk.dataset.players = String(count);
          chunk.style.top = (pct * i) + "%";
          chunk.style.height = pct + "%";
          chunk.innerHTML =
            '<span class="split-chunk-label">' + LOCAL_BINDINGS[i].name + "</span>" +
            '<div class="split-chunk-controls">' +
            '<div class="move-group">' +
            '<button type="button" class="btn-left" aria-label="Izquierda">←</button>' +
            '<button type="button" class="btn-right" aria-label="Derecha">→</button>' +
            "</div>" +
            '<button type="button" class="btn-jump" aria-label="Saltar">↑</button>' +
            "</div>";
          root.appendChild(chunk);
          const sync = makeSyncHoldVisuals(i);
          bindHoldButtonGlobal(chunk.querySelector(".btn-left"), "left", holdTouchesPads[i], sync);
          bindHoldButtonGlobal(chunk.querySelector(".btn-right"), "right", holdTouchesPads[i], sync);
          bindTapButton(chunk.querySelector(".btn-jump"), () => { localTouchPads[i].jumpPressed = true; });
        }
        if (!splitTouchBuilt) {
          document.addEventListener("touchend", releaseAllSplitTouches, { passive: false });
          document.addEventListener("touchcancel", releaseAllSplitTouches, { passive: false });
          splitTouchBuilt = true;
        }
      }

      function hideSplitTouch() {
        document.getElementById("split-touch").classList.remove("visible");
        for (let i = 0; i < 4; i++) {
          holdTouchesPads[i].left.clear();
          holdTouchesPads[i].right.clear();
          localTouchPads[i].resetAll();
        }
      }

      function resetAllTouchPads() {
        holdTouches.left.clear();
        holdTouches.right.clear();
        for (let i = 0; i < 4; i++) {
          holdTouchesPads[i].left.clear();
          holdTouchesPads[i].right.clear();
          localTouchPads[i].resetAll();
        }
        touchControls.resetAll();
        ["tc-left", "tc-right", "tc-jump"].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.classList.remove("pressed");
        });
        document.querySelectorAll(".split-chunk-pad button").forEach((el) => el.classList.remove("pressed"));
      }

      window.addEventListener("message", (e) => {
        if (!e.data || e.data.type !== "leocepa-input") return;
        touchControls.left = Boolean(e.data.left);
        touchControls.right = Boolean(e.data.right);
        if (e.data.jump) touchControls.jumpPressed = true;
      });

      initDomTouchControls();

      const PLAYER_COLORS = [0xff6b4a, 0x4a9fff, 0x66ee88, 0xff66ee];

      function getPlayerName() {
        let name = localStorage.getItem("hasta-luna-name");
        if (!name) {
          name = prompt("¿Cómo te llamas?", "Jugador") || "Jugador";
          name = name.trim().slice(0, 12) || "Jugador";
          localStorage.setItem("hasta-luna-name", name);
        }
        return name;
      }

      function shareRoomUrl(roomId) {
        const url = new URL(location.href);
        url.searchParams.set("room", roomId);
        url.searchParams.delete("host");
        return url.toString();
      }

      class MultiplayerManager {
        constructor(scene) {
          this.scene = scene;
          this.active = false;
          this.isHost = false;
          this.roomId = null;
          this.peer = null;
          this.conns = new Map();
          this.players = new Map();
          this.localPeerId = null;
          this.localColor = PLAYER_COLORS[0];
          this.seed = null;
          this.name = getPlayerName();
          this.started = false;
          this.lastSync = 0;
        }

        generateRoomId() {
          const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          let id = "";
          for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
          return id;
        }

        peerIdForRoom(roomId) {
          return "hluna" + roomId.toLowerCase();
        }

        createRoom(forcedRoomId) {
          return new Promise((resolve, reject) => {
            if (typeof Peer === "undefined") { reject(new Error("no_peer")); return; }
            this.active = true;
            this.isHost = true;
            this.roomId = forcedRoomId ? forcedRoomId.toUpperCase() : this.generateRoomId();
            this.seed = Math.floor(Math.random() * 999999999);
            const peerId = this.peerIdForRoom(this.roomId);
            this.peer = new Peer(peerId);
            this.peer.on("open", (id) => {
              this.localPeerId = id;
              this.localColor = PLAYER_COLORS[0];
              this.players.set(id, { id, name: this.name, color: this.localColor });
              const u = new URL(location.href);
              u.searchParams.set("room", this.roomId);
              u.searchParams.set("host", "1");
              history.replaceState(null, "", u.toString());
              resolve(this.roomId);
            });
            this.peer.on("connection", (conn) => this.wireConn(conn));
            this.peer.on("error", (err) => {
              if (err.type === "unavailable-id") {
                this.peer.destroy();
                this.createRoom().then(resolve).catch(reject);
              } else reject(err);
            });
          });
        }

        joinRoom(roomId) {
          return new Promise((resolve, reject) => {
            if (typeof Peer === "undefined") { reject(new Error("no_peer")); return; }
            this.active = true;
            this.isHost = false;
            this.roomId = roomId.toUpperCase();
            let done = false;
            this.peer = new Peer();
            this.peer.on("open", () => {
              const conn = this.peer.connect(this.peerIdForRoom(this.roomId), { reliable: true });
              this.wireConn(conn, true);
              conn.on("open", () => {
                if (done) return;
                done = true;
                this.sendConn(conn, { t: "join", name: this.name });
                resolve(this.roomId);
              });
              conn.on("error", reject);
            });
            this.peer.on("error", reject);
            setTimeout(() => { if (!done) reject(new Error("timeout")); }, 18000);
          });
        }

        wireConn(conn, isHostConn) {
          conn.on("data", (raw) => this.onData(conn, raw));
          conn.on("close", () => {
            const id = conn.peer;
            if (this.isHost) {
              this.conns.delete(id);
              this.players.delete(id);
              this.broadcast({ t: "out", id }, id);
              this.scene.onRemoteEvent({ t: "out", id });
              this.scene.onLobbyUpdate();
            }
          });
          if (this.isHost && conn.peer) this.conns.set(conn.peer, conn);
          if (!this.isHost && isHostConn) this.conns.set("host", conn);
        }

        serializePlayers() {
          return [...this.players.values()].map((p) => ({
            id: p.id, name: p.name, color: p.color,
          }));
        }

        onData(conn, raw) {
          let msg;
          try { msg = typeof raw === "string" ? JSON.parse(raw) : raw; } catch { return; }

          if (this.isHost) {
            if (msg.t === "join") {
              if (this.players.size >= 4) return;
              const guestId = conn.peer;
              const color = PLAYER_COLORS[this.players.size % PLAYER_COLORS.length];
              this.players.set(guestId, { id: guestId, name: msg.name, color });
              this.conns.set(guestId, conn);
              this.sendConn(conn, {
                t: "welcome",
                seed: this.seed,
                id: guestId,
                color,
                players: this.serializePlayers(),
              });
              this.broadcast({ t: "joined", id: guestId, name: msg.name, color }, guestId);
              this.scene.onPlayerJoined({ id: guestId, name: msg.name, color });
              this.scene.onLobbyUpdate();
            } else if (msg.t === "pos" || msg.t === "fall" || msg.t === "moon") {
              this.broadcast(msg, conn.peer);
              this.scene.onRemoteEvent(msg);
            }
            return;
          }

          if (msg.t === "welcome") {
            this.localPeerId = msg.id;
            this.seed = msg.seed;
            this.localColor = msg.color;
            this.players.clear();
            msg.players.forEach((p) => this.players.set(p.id, p));
            this.scene.onLobbyUpdate();
          } else if (msg.t === "start") {
            this.started = true;
            this.scene.startMultiplayerGame(msg.seed);
          } else if (msg.t === "joined") {
            this.players.set(msg.id, { id: msg.id, name: msg.name, color: msg.color });
            this.scene.onPlayerJoined(msg);
            this.scene.onLobbyUpdate();
          } else if (msg.t === "pos" || msg.t === "fall" || msg.t === "moon" || msg.t === "out") {
            this.scene.onRemoteEvent(msg);
          }
        }

        sendConn(conn, msg) {
          if (conn && conn.open) conn.send(JSON.stringify(msg));
        }

        broadcast(msg, exceptId) {
          for (const [id, conn] of this.conns) {
            if (id !== exceptId) this.sendConn(conn, msg);
          }
        }

        sendToHost(msg) {
          this.sendConn(this.conns.get("host"), msg);
        }

        emit(msg) {
          if (!this.active) return;
          if (this.isHost) this.broadcast(msg);
          else this.sendToHost(msg);
        }

        syncScene(scene) {
          if (!this.active || !this.started || scene.state !== "playing") return;
          const now = Date.now();
          if (now - this.lastSync < 55) return;
          this.lastSync = now;
          const msg = {
            t: "pos",
            id: this.localPeerId,
            x: scene.player.x,
            y: scene.player.y,
            f: scene.player.facing,
            alt: Math.floor(scene.altitudeMeters),
          };
          if (this.isHost) {
            this.broadcast(msg);
            scene.onRemoteEvent(msg);
          } else {
            this.sendToHost(msg);
          }
        }

        hostStart() {
          if (!this.isHost) return;
          this.started = true;
          this.broadcast({ t: "start", seed: this.seed });
          this.scene.startMultiplayerGame(this.seed);
        }

        destroy() {
          for (const conn of this.conns.values()) conn.close();
          if (this.peer) this.peer.destroy();
          this.conns.clear();
          this.players.clear();
          this.active = false;
          this.started = false;
          this.peer = null;
        }
      }

      class Player {
        constructor(scene, x, y, opts) {
          opts = opts || {};
          this.scene = scene;
          this.name = opts.name || "Jugador";
          this.color = opts.color || 0xff6b4a;
          this.bindings = opts.bindings || null;
          this.fallen = false;
          this.altitudeMeters = 0;
          this.sprite = scene.add.rectangle(x, y, PLAYER_CFG.width, PLAYER_CFG.height, this.color);
          this.sprite.setStrokeStyle(2, 0xffffff, 0.45);
          this.label = opts.showLabel
            ? scene.add.text(x, y - 22, this.name, {
                fontFamily: "Segoe UI, sans-serif", fontSize: "10px", color: "#ffffff",
              }).setOrigin(0.5, 1).setShadow(1, 1, "#000", 2)
            : null;
          scene.physics.add.existing(this.sprite);
          this.body = this.sprite.body;
          this.body.setCollideWorldBounds(false);
          this.body.setMaxVelocity(PLAYER_CFG.speed, PLAYER_CFG.maxFallSpeed);
          this.body.setGravityY(PLAYER_CFG.gravity);
          this.body.setSize(PLAYER_CFG.width - 4, PLAYER_CFG.height - 2);
          this.jumpsLeft = 2;
          this.wasOnGround = false;
          this.facing = 1;
        }

        update(input) {
          if (this.fallen) return;
          const { left, right, jumpPressed } = input;

          if (left) { this.body.setVelocityX(-PLAYER_CFG.speed); this.facing = -1; }
          else if (right) { this.body.setVelocityX(PLAYER_CFG.speed); this.facing = 1; }
          else { this.body.setVelocityX(this.body.velocity.x * 0.82); }

          const onGround = this.body.blocked.down || this.body.touching.down;
          if (onGround && !this.wasOnGround) this.jumpsLeft = 2;
          this.wasOnGround = onGround;

          if (jumpPressed && this.jumpsLeft > 0) {
            const vel = this.jumpsLeft === 2 ? PLAYER_CFG.jumpVelocity : PLAYER_CFG.doubleJumpVelocity;
            this.body.setVelocityY(vel);
            this.jumpsLeft--;
          }
          this.sprite.setScale(this.facing, 1);
          if (this.label) {
            this.label.setPosition(this.sprite.x, this.sprite.y - 20);
            this.label.setScale(this.facing, 1);
          }
        }

        get x() { return this.sprite.x; }
        get y() { return this.sprite.y; }

        markFallen() {
          this.fallen = true;
          this.body.setVelocity(0, 0);
          this.body.setAllowGravity(false);
          this.sprite.setAlpha(0.4);
          if (this.label) this.label.setAlpha(0.5);
        }

        reset(x, y) {
          this.fallen = false;
          this.sprite.setAlpha(1);
          this.sprite.setPosition(x, y);
          this.body.setAllowGravity(true);
          this.body.setGravityY(PLAYER_CFG.gravity);
          this.body.setVelocity(0, 0);
          this.jumpsLeft = 2;
          this.wasOnGround = false;
          this.altitudeMeters = 0;
          if (this.label) this.label.setAlpha(1);
        }

        destroy() {
          this.sprite.destroy();
          if (this.label) this.label.destroy();
          if (this.sliceBg) this.sliceBg.destroy();
          if (this.sliceHud) this.sliceHud.destroy();
        }
      }

      function drawSliceBackground(gfx, altitudeMeters, sliceH, offsetY) {
        const zone = getZoneForAltitude(altitudeMeters);
        const top = Phaser.Display.Color.IntegerToColor(zone.topColor);
        const bottom = Phaser.Display.Color.IntegerToColor(zone.bottomColor);
        gfx.clear();
        const steps = 16;
        for (let i = 0; i < steps; i++) {
          const t = i / (steps - 1);
          const color = Phaser.Display.Color.GetColor(
            Phaser.Math.Linear(top.red, bottom.red, t),
            Phaser.Math.Linear(top.green, bottom.green, t),
            Phaser.Math.Linear(top.blue, bottom.blue, t)
          );
          gfx.fillStyle(color, 1);
          gfx.fillRect(0, offsetY + (sliceH / steps) * i, GAME_WIDTH, sliceH / steps + 1);
        }
      }

      class WorldGenerator {
        constructor(scene, platformGroup, startY, seed) {
          this.scene = scene;
          this.platformGroup = platformGroup;
          this.platforms = [];
          this.zone = getZoneForAltitude(0);
          this.rng = seed != null ? new Phaser.Math.RandomDataGenerator([String(seed)]) : null;

          const first = this.createPlatform(startY, GAME_WIDTH / 2, 150, "normal");
          this.platforms.push(first);

          for (let i = 0; i < 17; i++) {
            this.spawnNextPlatform(this.getTopPlatform());
          }
        }

        rndFrac() {
          return this.rng ? this.rng.frac() : Math.random();
        }

        rndBetween(min, max) {
          return Math.floor(this.rndFrac() * (max - min + 1)) + min;
        }

        getTopPlatform() {
          return this.platforms.reduce((top, p) => (p.sprite.y < top.sprite.y ? p : top));
        }

        pickType(altitudeMeters) {
          const roll = this.rndFrac();
          if (altitudeMeters > 3000 && roll < 0.1) return "moving";
          if (altitudeMeters > 1000 && roll < 0.15) return "fragile";
          return "normal";
        }

        createPlatform(y, x, width, type) {
          const altitudeMeters = Math.max(0, -y * 0.5);
          const zone = getZoneForAltitude(altitudeMeters);
          let color = zone.platformColor;
          if (type === "fragile") color = 0xc97b5a;
          if (type === "moving") color = 0x5ab8c9;

          const sprite = this.scene.add.rectangle(x, y, width, WORLD.platformHeight, color);
          sprite.setStrokeStyle(2, zone.accentColor, 0.6);
          this.platformGroup.add(sprite);
          sprite.body.updateFromGameObject();

          const data = { sprite, body: sprite.body, type };
          if (type === "moving") {
            data.moveSpeed = this.rndBetween(35, 70);
            data.moveDir = this.rndFrac() < 0.5 ? -1 : 1;
            const halfW = width / 2;
            data.moveMin = WORLD.horizontalMargin + halfW;
            data.moveMax = this.scene.scale.width - WORLD.horizontalMargin - halfW;
          }
          if (type === "fragile") data.hitsLeft = 1;
          return data;
        }

        spawnNextPlatform(prev) {
          const gap = this.rndBetween(WORLD.verticalGapMin, WORLD.verticalGapMax);
          const y = prev.sprite.y - gap;
          const reach = maxHorizontalReach(gap);
          const width = this.rndBetween(WORLD.platformMinWidth, WORLD.platformMaxWidth);
          const halfW = width / 2;
          const screenW = this.scene.scale.width;

          let minX = prev.sprite.x - reach;
          let maxX = prev.sprite.x + reach;
          const screenMin = WORLD.horizontalMargin + halfW;
          const screenMax = screenW - WORLD.horizontalMargin - halfW;

          minX = Phaser.Math.Clamp(minX, screenMin, screenMax);
          maxX = Phaser.Math.Clamp(maxX, screenMin, screenMax);

          let x;
          if (minX > maxX) {
            x = Phaser.Math.Clamp(prev.sprite.x, screenMin, screenMax);
          } else {
            x = this.rndBetween(minX, maxX);
          }

          const altitudeMeters = Math.max(0, -y * 0.5);
          const type = this.pickType(altitudeMeters);
          const data = this.createPlatform(y, x, width, type);
          this.platforms.push(data);
          return data;
        }

        update(playerY, altitudeMeters) {
          this.zone = getZoneForAltitude(altitudeMeters);
          const targetY = playerY - this.scene.scale.height * 1.5;
          while (this.getTopPlatform().sprite.y > targetY) {
            this.spawnNextPlatform(this.getTopPlatform());
          }
          const cullY = playerY + this.scene.scale.height + 200;
          this.platforms = this.platforms.filter((p) => {
            if (p.sprite.y < cullY) return true;
            p.sprite.destroy();
            return false;
          });
          for (const p of this.platforms) {
            if (p.type === "moving" && p.moveSpeed) {
              p.sprite.x += p.moveSpeed * p.moveDir * (this.scene.game.loop.delta / 1000);
              if (p.sprite.x <= p.moveMin) { p.sprite.x = p.moveMin; p.moveDir = 1; }
              else if (p.sprite.x >= p.moveMax) { p.sprite.x = p.moveMax; p.moveDir = -1; }
              p.body.updateFromGameObject();
            }
          }
        }

        getPlatforms() { return this.platforms; }

        onPlayerLand(platform) {
          if (platform.type === "fragile") {
            platform.hitsLeft = (platform.hitsLeft || 1) - 1;
            if (platform.hitsLeft <= 0) {
              this.scene.tweens.add({
                targets: platform.sprite, alpha: 0, scaleX: 0.5, duration: 200,
                onComplete: () => {
                  platform.sprite.destroy();
                  this.platforms = this.platforms.filter((p) => p !== platform);
                },
              });
            }
          }
        }

        destroy() {
          for (const p of this.platforms) p.sprite.destroy();
          this.platforms = [];
        }
      }

            .setScrollFactor(0).setOrigin(0.5).setDepth(20);

            if (this.state !== "menu" && this.state !== "gameover") return;

            if (target && target.closest && (
              target.closest("#touch-controls") ||
              target.closest("#menu-btns") ||
              target.closest("#lobby-ui") ||
              target.closest("#local-pick") ||

              prompt("Copia este enlace y envíaselo a tu amigo:", link);

          const params = new URLSearchParams(location.search);
          const room = params.get("room");
          if (room && params.get("host") === "1") this.createRoom(room);
          else if (room) this.joinRoom(room);
          else this.showMenu();

        hideAllMenuUi() {
          document.getElementById("menu-btns").classList.remove("visible");
          document.getElementById("lobby-ui").classList.remove("visible");
          document.getElementById("local-pick").classList.remove("visible");
        }

        setMenuUi(mode) {
          this.hideAllMenuUi();
          if (mode === "menu") document.getElementById("menu-btns").classList.add("visible");
          if (mode === "lobby") document.getElementById("lobby-ui").classList.add("visible");
          if (mode === "local_pick") document.getElementById("local-pick").classList.add("visible");
        }

        controlHints() {
          if (touchControls.enabled) {
            return "Solo, local u online abajo\nLocal = pantalla dividida";
          }
          return "Solo, local u online\nLocal = cada jugador su trozo";
        }

        setGlobalHudVisible(visible) {
          this.bgGraphics.setVisible(visible);
          this.moonSprite.setVisible(visible);
          this.hudAltitude.setVisible(visible);
          this.hudZone.setVisible(visible);
          this.hudBest.setVisible(visible);
        }

        showMenu() {
          this.state = "menu";
          this.localMode = false;
          this.teardownSplitScreen();
          hideSplitTouch();
          if (touchControls.enabled) {
            document.getElementById("touch-controls").classList.add("visible");
          }
          if (this.mp) { this.mp.destroy(); this.mp = null; }
          this.clearRemotes();
          this.setMenuUi("menu");
          this.setGlobalHudVisible(true);
          this.mpHud.setVisible(false);
          this.overlayText.setText("Hasta la luna\no más");
          this.subText.setText(this.controlHints());
          this.updateHud();
        }

        showLocalPick() {
          this.state = "menu";
          this.setMenuUi("local_pick");
          this.overlayText.setText("Multijugador local");
          this.subText.setText("La pantalla se divide en trozos\n2, 3 o 4 jugadores");
        }

        teardownSplitScreen() {
          hideSplitTouch();
          for (const pl of this.players) {
            if (pl.sliceBg) { pl.sliceBg.destroy(); pl.sliceBg = null; }
            if (pl.sliceHud) { pl.sliceHud.destroy(); pl.sliceHud = null; }
          }
          for (let i = 1; i < this.splitCameras.length; i++) {
            this.splitCameras[i].destroy();
          }
          this.splitCameras = [];
          if (this.splitDivider) {
            this.splitDivider.destroy();
            this.splitDivider = null;
          }
          this.cameras.main.setViewport(0, 0, GAME_WIDTH, GAME_HEIGHT);
          this.cameras.main.setVisible(true);
          this.cameras.main.setScroll(0, 0);
          this.setGlobalHudVisible(true);
        }

        setupSplitScreen(count) {
          this.teardownSplitScreen();
          this.localPlayerCount = count;
          const sliceH = GAME_HEIGHT / count;
          this.setGlobalHudVisible(false);
          this.mpHud.setVisible(false);

          this.splitCameras = [];
          for (let i = 0; i < count; i++) {
            const cam = i === 0 ? this.cameras.main : this.cameras.add(0, i * sliceH, GAME_WIDTH, sliceH);
            cam.setViewport(0, i * sliceH, GAME_WIDTH, sliceH);
            cam.setVisible(true);
            cam.setScroll(0, 0);
            cam.setBackgroundColor(0x0a0a1a);
            this.splitCameras.push(cam);

            const pl = this.players[i];
            if (pl.label) pl.label.setVisible(false);
            pl.sliceBg = this.add.graphics().setDepth(-10).setScrollFactor(0);
            pl.sliceHud = this.add.text(10, 6, pl.name, {
              fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#ffffff",
            }).setScrollFactor(0).setDepth(15).setShadow(1, 1, "#000", 3);
          }

          for (let i = 0; i < count; i++) {
            for (let j = 0; j < count; j++) {
              if (i === j) continue;
              const a = this.players[i];
              const b = this.players[j];
              this.splitCameras[i].ignore(b.sprite);
              if (b.label) this.splitCameras[i].ignore(b.label);
              this.splitCameras[i].ignore(b.sliceBg);
              this.splitCameras[i].ignore(b.sliceHud);
            }
            this.splitCameras[i].ignore(this.overlayText);
            this.splitCameras[i].ignore(this.subText);
          }

          this.splitDivider = this.add.graphics().setScrollFactor(0).setDepth(200);
          this.splitDivider.clear();
          for (let i = 1; i < count; i++) {
            this.splitDivider.fillStyle(0xffffff, 0.3);
            this.splitDivider.fillRect(0, i * sliceH - 2, GAME_WIDTH, 4);
          }

          document.getElementById("touch-controls").classList.remove("visible");
          showSplitTouch(count);
        }

        keyIsDown(names) {
          return names.some((n) => {
            if (n === "LEFT") return this.cursors.left.isDown;
            if (n === "RIGHT") return this.cursors.right.isDown;
            if (n === "UP") return this.cursors.up.isDown;
            return this.keys[n] && this.keys[n].isDown;
          });
        }

        keyJustDown(names) {
          return names.some((n) => {
            if (n === "UP") return Phaser.Input.Keyboard.JustDown(this.cursors.up);
            if (n === "LEFT") return Phaser.Input.Keyboard.JustDown(this.cursors.left);
            if (n === "RIGHT") return Phaser.Input.Keyboard.JustDown(this.cursors.right);
            return this.keys[n] && Phaser.Input.Keyboard.JustDown(this.keys[n]);
          });
        }

        getPlayerInput(index) {
          const b = LOCAL_BINDINGS[index];
          let touch = null;
          if (b.touch != null && touchControls.enabled) {
            touch = this.localMode ? localTouchPads[b.touch] : (b.touch === 0 ? touchControls : null);
          }
          return {
            left: this.keyIsDown(b.keys.left) || (touch && touch.left),
            right: this.keyIsDown(b.keys.right) || (touch && touch.right),
            jumpPressed: this.keyJustDown(b.keys.jump) || (touch && touch.jumpPressed),
          };
        }

        setupColliders() {
          for (const c of this.playerColliders) c.destroy();
          this.playerColliders = [];
          for (const pl of this.players) {
            const col = this.physics.add.collider(
              pl.sprite, this.platformGroup,
              (playerSprite, platform) => {
                const p = this.players.find((x) => x.sprite === playerSprite);
                if (!p || p.fallen) return;
                const body = p.body;
                if (body.velocity.y >= 0 && body.bottom <= platform.y + 8) {
                  const pdata = this.world.getPlatforms().find((x) => x.sprite === platform);
                  if (pdata) this.world.onPlayerLand(pdata);
                }
              },
              (playerSprite, platform) => {
                const p = this.players.find((x) => x.sprite === playerSprite);
                if (!p || p.fallen) return false;
                return p.body.velocity.y >= 0 && p.body.bottom <= platform.y + 10;
              }
            );
            this.playerColliders.push(col);
          }
        }

        showLobby() {
          this.state = "lobby";
          this.setMenuUi("lobby");
          this.overlayText.setText("Sala multijugador");
          this.onLobbyUpdate();
        }

        onLobbyUpdate() {
          if (!this.mp) return;
          document.getElementById("lobby-room").textContent = "Sala: " + this.mp.roomId;
          const names = [...this.mp.players.values()].map((p) => p.name).join(", ");
          document.getElementById("lobby-players").textContent = "Jugadores (" + this.mp.players.size + "/4): " + names;
          document.getElementById("lobby-start").style.display = this.mp.isHost ? "block" : "none";
          const wait = this.mp.isHost
            ? "Comparte el enlace.\nCuando estéis, pulsa Empezar."
            : "Esperando a que el anfitrión empiece…";
          this.subText.setText(wait);
        }

        async createRoom(existingRoom) {
          this.setMenuUi("menu");
          this.overlayText.setText("Creando sala…");
          this.subText.setText("Un momento");
          try {
            this.mp = new MultiplayerManager(this);
            await this.mp.createRoom(existingRoom);
            this.showLobby();
          } catch {
            this.mp = null;
            this.overlayText.setText("No se pudo crear sala");
            this.subText.setText("Prueba de nuevo o juega solo");
            this.setMenuUi("menu");
          }
        }

        promptJoin() {
          const code = prompt("Código de sala (6 letras):", "");
          if (code) this.joinRoom(code.trim());
        }

        async joinRoom(code) {
          this.setMenuUi("menu");
          this.overlayText.setText("Uniéndose…");
          this.subText.setText("Sala " + code.toUpperCase());
          try {
            this.mp = new MultiplayerManager(this);
            await this.mp.joinRoom(code);
            this.showLobby();
          } catch {
            this.mp = null;
            this.overlayText.setText("No se encontró la sala");
            this.subText.setText("Revisa el código o crea una nueva");
            this.setMenuUi("menu");
          }
        }

        onPlayerJoined(p) {
          if (p.id === this.mp?.localPeerId) return;
          if (!this.remotes.has(p.id)) {
            this.remotes.set(p.id, new RemoteAvatar(this, p.id, p.name, p.color));
          }
        }

        onRemoteEvent(msg) {
          if (!msg.id || msg.id === this.mp?.localPeerId) return;
          if (msg.t === "out") {
            const r = this.remotes.get(msg.id);
            if (r) { r.destroy(); this.remotes.delete(msg.id); }
            return;
          }
          if (!this.remotes.has(msg.id)) {
            const pl = this.mp?.players.get(msg.id);
            if (pl) this.remotes.set(msg.id, new RemoteAvatar(this, pl.id, pl.name, pl.color));
          }
          const r = this.remotes.get(msg.id);
          if (!r) return;
          if (msg.t === "pos") r.setTarget(msg.x, msg.y, msg.f, msg.alt);
          if (msg.t === "fall") r.markFallen();
          if (msg.t === "moon") r.markFallen();
        }

        clearRemotes() {
          for (const r of this.remotes.values()) r.destroy();
          this.remotes.clear();
        }

        startSolo() {
          if (this.mp) { this.mp.destroy(); this.mp = null; }
          this.clearRemotes();
          this.localMode = false;
          this.teardownSplitScreen();
          hideSplitTouch();
          if (touchControls.enabled) {
            document.getElementById("touch-controls").classList.add("visible");
          }
          this.mpHud.setVisible(false);
          this.startGame(null, 1);
        }

        startLocalGame(count) {
          if (this.mp) { this.mp.destroy(); this.mp = null; }
          this.clearRemotes();
          this.localMode = true;
          this.startGame(null, count);
          this.setupSplitScreen(count);
        }

        startMultiplayerGame(seed) {
          this.localMode = false;
          this.teardownSplitScreen();
          hideSplitTouch();
          this.worldSeed = seed;
          for (const p of this.mp.players.values()) {
            if (p.id !== this.mp.localPeerId) this.onPlayerJoined(p);
          }
          this.mpHud.setVisible(true);
          this.startGame(seed, 1);
        }

        returnToMenu() {
          if (this.mp) { this.mp.destroy(); this.mp = null; }
          this.teardownSplitScreen();
          const u = new URL(location.href);
          u.searchParams.delete("room");
          u.searchParams.delete("host");
          history.replaceState(null, "", u.toString());
          this.showMenu();
        }

        resetTouchState() {
          resetAllTouchPads();
        }

        startGame(seed, playerCount) {
          if (this.state === "playing") return;
          playerCount = playerCount || 1;
          this.hideAllMenuUi();
          this.resetTouchState();
          for (const p of this.players) p.destroy();
          this.players = [];
          this.world.destroy();
          this.platformGroup.clear(true, true);
          const startY = GAME_HEIGHT - 120;
          this.world = new WorldGenerator(this, this.platformGroup, startY, seed);
          const offsets = [-50, 50, -20, 20];
          for (let i = 0; i < playerCount; i++) {
            const cfg = LOCAL_BINDINGS[i];
            const pl = new Player(this, GAME_WIDTH / 2 + offsets[i], startY - 60, {
              name: cfg.name,
              color: cfg.color,
              bindings: cfg,
              showLabel: playerCount > 1,
            });
            this.players.push(pl);
          }
          this.player = this.players[0];
          if (this.mp && this.mp.localColor && this.players[0]) {
            this.players[0].sprite.setFillStyle(this.mp.localColor);
          }
          this.setupColliders();
          this.altitudeMeters = 0;
          this.state = "playing";
          this.overlayText.setText("");
          this.subText.setText("");
          if (!this.localMode) {
            this.cameras.main.scrollY = 0;
          }
        }

        endGame(reason) {
          this.state = "gameover";
          this.teardownSplitScreen();
          hideSplitTouch();
          if (touchControls.enabled) {
            document.getElementById("touch-controls").classList.add("visible");
          }
          const best = Math.max(...this.players.map((p) => p.altitudeMeters), this.altitudeMeters);
          if (best > this.bestMeters) {
            this.bestMeters = best;
            localStorage.setItem(BEST_KEY, String(this.bestMeters));
          }
          if (this.mp && this.mp.active) {
            this.mp.emit({ t: "fall", id: this.mp.localPeerId, alt: Math.floor(this.altitudeMeters) });
          }
          this.overlayText.setText(reason || "¡Caíste!");
          this.subText.setText("Toca para volver al menú");
        }

        endLocalGame(title) {
          this.state = "gameover";
          this.teardownSplitScreen();
          hideSplitTouch();
          const best = Math.max(...this.players.map((p) => p.altitudeMeters));
          if (best > this.bestMeters) {
            this.bestMeters = best;
            localStorage.setItem(BEST_KEY, String(this.bestMeters));
          }
          this.overlayText.setText(title);
          this.subText.setText("Toca para volver al menú");
        }

        updateMpHud() {
          if (this.localMode && this.splitCameras.length) return;
          if (!this.mp || !this.mp.active) { this.mpHud.setVisible(false); return; }
          const rows = [...this.mp.players.values()]
            .map((p) => {
              const r = this.remotes.get(p.id);
              const alt = p.id === this.mp.localPeerId
                ? Math.floor(this.altitudeMeters)
                : (r ? r.altitude : 0);
              return p.name + " " + formatAltitude(alt);
            })
            .join("  ·  ");
          this.mpHud.setText("🏁 " + rows);
        }

        updateBackground() {
          const zone = getZoneForAltitude(this.altitudeMeters);
          const top = Phaser.Display.Color.IntegerToColor(zone.topColor);
          const bottom = Phaser.Display.Color.IntegerToColor(zone.bottomColor);
          this.bgGraphics.clear();
          const steps = 24;
          for (let i = 0; i < steps; i++) {
            const t = i / (steps - 1);
            const color = Phaser.Display.Color.GetColor(
              Phaser.Math.Linear(top.red, bottom.red, t),
              Phaser.Math.Linear(top.green, bottom.green, t),
              Phaser.Math.Linear(top.blue, bottom.blue, t)
            );
            this.bgGraphics.fillStyle(color, 1);
            this.bgGraphics.fillRect(0, (GAME_HEIGHT / steps) * i, GAME_WIDTH, GAME_HEIGHT / steps + 1);
          }
          if (this.altitudeMeters >= 10000) {
            for (const star of this.stars) {
              const twinkle = 0.5 + 0.5 * Math.sin(this.time.now * 0.003 + star.x);
              this.bgGraphics.fillStyle(0xffffff, star.alpha * twinkle * Math.min(1, (this.altitudeMeters - 10000) / 5000));
              this.bgGraphics.fillCircle(star.x, star.y, star.size);
            }
          }
          const moonProgress = Phaser.Math.Clamp((this.altitudeMeters - 80000) / 20000, 0, 1);
          this.moonSprite.setAlpha(moonProgress * 0.9);
          this.moonSprite.setScale(0.6 + moonProgress * 0.6);
        }

        updateHud() {
          const zone = getZoneForAltitude(this.altitudeMeters);
          this.hudAltitude.setText(formatAltitude(this.altitudeMeters));
          this.hudZone.setText(zone.name);
          this.hudBest.setText("Récord: " + formatAltitude(this.bestMeters));
        }

        update() {
          if (this.state === "lobby") {
            this.updateBackground();
            return;
          }
          if (this.state !== "playing") {
            this.updateBackground();
            this.updateHud();
            return;
          }

          for (let i = 0; i < this.players.length; i++) {
            this.players[i].update(this.getPlayerInput(i));
          }
          touchControls.resetJump();
          for (let t = 0; t < 4; t++) localTouchPads[t].resetJump();

          let leaderY = this.player.y;
          this.altitudeMeters = 0;

          if (this.localMode && this.splitCameras.length) {
            const sliceH = GAME_HEIGHT / this.splitCameras.length;
            const dangerScale = sliceH / GAME_HEIGHT;

            for (let i = 0; i < this.players.length; i++) {
              const pl = this.players[i];
              const cam = this.splitCameras[i];
              const raw = Math.max(0, (GAME_HEIGHT - 120 - pl.y) * ALTITUDE.metersPerPixel);
              pl.altitudeMeters = Math.max(pl.altitudeMeters, raw);
              this.altitudeMeters = Math.max(this.altitudeMeters, pl.altitudeMeters);
              if (!pl.fallen && pl.y < leaderY) leaderY = pl.y;

              const dangerY = cam.scrollY + sliceH - WORLD.dangerZoneOffset * dangerScale;
              if (!pl.fallen && pl.y > dangerY) pl.markFallen();

              const targetScrollY = pl.y - sliceH * 0.42;
              if (targetScrollY < cam.scrollY) {
                cam.scrollY = Phaser.Math.Linear(cam.scrollY, targetScrollY, 0.08);
              }

              const sliceTop = i * sliceH;
              drawSliceBackground(pl.sliceBg, pl.altitudeMeters, sliceH, sliceTop);
              const zone = getZoneForAltitude(pl.altitudeMeters);
              pl.sliceHud.setPosition(10, sliceTop + 6);
              pl.sliceHud.setText(formatAltitude(pl.altitudeMeters) + " · " + zone.name + (pl.fallen ? " 💀" : ""));
            }

            this.world.update(leaderY, this.altitudeMeters);

            const alive = this.players.filter((p) => !p.fallen);
            const moonWinner = alive.find((p) => p.altitudeMeters >= ALTITUDE.moonThreshold);
            if (moonWinner) {
              this.endLocalGame("🌙 " + moonWinner.name + " llegó a la luna!");
              return;
            }
            if (alive.length === 0) {
              const best = [...this.players].sort((a, b) => b.altitudeMeters - a.altitudeMeters)[0];
              this.endLocalGame("🏆 " + best.name + " gana con " + formatAltitude(best.altitudeMeters));
            }
            return;
          }

          const dangerY = this.cameras.main.scrollY + GAME_HEIGHT - WORLD.dangerZoneOffset;
          for (const pl of this.players) {
            const raw = Math.max(0, (GAME_HEIGHT - 120 - pl.y) * ALTITUDE.metersPerPixel);
            pl.altitudeMeters = Math.max(pl.altitudeMeters, raw);
            this.altitudeMeters = Math.max(this.altitudeMeters, pl.altitudeMeters);
            if (!pl.fallen && pl.y < leaderY) leaderY = pl.y;
            if (!pl.fallen && pl.y > dangerY) {
              this.endGame("¡Caíste!");
              return;
            }
          }

          const targetScrollY = leaderY - GAME_HEIGHT * 0.45;
          if (targetScrollY < this.cameras.main.scrollY) {
            this.cameras.main.scrollY = Phaser.Math.Linear(this.cameras.main.scrollY, targetScrollY, 0.08);
          }

          this.world.update(leaderY, this.altitudeMeters);
          if (this.mp && this.mp.active) this.mp.syncScene(this);
          for (const r of this.remotes.values()) r.update();
          this.updateBackground();
          this.updateHud();
          this.updateMpHud();

          if (this.altitudeMeters >= ALTITUDE.moonThreshold) {
            this.state = "gameover";
            if (this.mp && this.mp.active) {
              this.mp.emit({ t: "moon", id: this.mp.localPeerId, alt: Math.floor(this.altitudeMeters) });
            }
            this.overlayText.setText("¡Llegaste a la luna!");
            this.subText.setText(formatAltitude(this.altitudeMeters) + "\n\n¡Ganaste la carrera!\nToca para volver al menú");
            if (this.altitudeMeters > this.bestMeters) {
              this.bestMeters = this.altitudeMeters;
              localStorage.setItem(BEST_KEY, String(this.bestMeters));
            }
          }
        }
      }

      const phaserGame = new Phaser.Game({
        type: Phaser.AUTO,
        width: GAME_WIDTH,
        height: GAME_HEIGHT,
        parent: "game",
        backgroundColor: "#0a0a1a",
        physics: { default: "arcade", arcade: { gravity: { x: 0, y: 0 }, debug: false } },
        input: { activePointers: 10 },
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH,
          width: GAME_WIDTH,
          height: GAME_HEIGHT,
        },
        scene: [GameScene],
      });
      phaserGame.events.once("ready", () => {
        if (phaserGame.input && phaserGame.input.touch) {
          phaserGame.input.touch.capture = false;
        }
      });
    </script>
  </body>
